### settings ###

# video
profile=high-quality

# screenshots
screenshot-format=jpg
screenshot-jpeg-quality=100
screenshot-dir="/home/kat/Pictures/Screenshots/mpv"
screenshot-template="%f_%wH%wM%wS_%#00n"

### catppuccin theme ###
# main mpv options
background-color='#303446'
osd-back-color='#232634'
osd-border-color='#232634'
osd-color='#c6d0f5'
osd-shadow-color='#303446'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=3c2c29
script-opts-append=stats-font_color=f5d0c6
script-opts-append=stats-plot_bg_border_color=f1bbba
script-opts-append=stats-plot_bg_color=3c2c29
script-opts-append=stats-plot_color=f1bbba

# UOSC options
script-opts-append=uosc-color=foreground=babbf1,foreground_text=414559,background=303446,background_text=c6d0f5,curtain=292c3c,success=a6d189,error=e78284
