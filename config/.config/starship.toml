"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

palette = "catppuccin_frappe"

format = '$all$env_var$character$username$hostname$character$directory '

# `rv` currently sets a permanent $RUBY_VERSION variable
# so my shell always shows the ruby ver no matter the pwd
# this just gets rid of the whole thing. whatever man
[ruby]
format = ""

[character]
success_symbol = '[❥](bold pink)'

[hostname]
ssh_only = false
format = '[$ssh_symbol$hostname](bold sapphire)'

[username]
show_always = true
format = '[$user](bold lavender)[@](bold green)'

[directory]
style = "bold green"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[env_var.ZMX_SESSION]
symbol = " "
format = "[$symbol]($style)"
description = "zmx session name"
style = "bold green"

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
